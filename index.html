<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no, email=no, address=no, date=no">
<title>Jama Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f1f1f;
    --muted: #8c8c8c;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--muted);
    font-family: "Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", sans-serif;
    font-weight: 300;
    font-size: clamp(15px, 4.2vw, 21px);
    letter-spacing: 0.26em;
    line-height: 1.2;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12vh 1.5rem 6vh;
  }
  main p { margin: 0 0 2.1em; overflow-wrap: anywhere; }
  main p.name { color: var(--ink); }
  main p.gap { margin-bottom: 3.4em; }
  main p:last-child { margin-bottom: 0; }
  .value { color: var(--ink); }
  a { color: inherit; text-decoration: none; transition: color .2s; }
  a:hover { color: #000; }
  a:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
</style>
</head>
<body>
  <main>
    <p class="name">Jama Projects</p>
    <p>Email: <span class="value">js@jamaprojects.com</span></p>
    <p>Phone: <span class="value">+45 21803534</span></p>
    <p class="gap">Sjællandsgade 37, København N</p>
    <p><a href="https://instagram.com/jamaprojects" target="_blank" rel="noopener">instagram.com/jamaprojects</a></p>
    <p><a href="https://linkedin.com/company/106792348" target="_blank" rel="noopener">linkedin.com/company/106792348</a></p>
  </main>
</body>
</html>
